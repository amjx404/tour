<title>Tour Wolfurt</title>

<style>
/* Layout: eine Spalte fürs Handy im Auto. Oben Status, mittig der nächste Halt groß, darunter die Folge. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#E2E6EB; --fg:#171B21; --muted:#56606C; --line:#C8CED6;
  --a:#F3B61F; --a-ink:#1B1500; --b:#2B5CD9; --b-ink:#FFFFFF; --go:#1F7A4D; --go-ink:#FFFFFF; --warn:#B54708; --bld:#CDD3DB; --bld-line:#A9B2BE;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#1A1F26; --surface2:#242B34; --fg:#EEF1F5; --muted:#9AA5B3; --line:#2E3742;
    --a:#F3B61F; --a-ink:#1B1500; --b:#5C8CFF; --b-ink:#0A1228; --go:#3DBB7E; --go-ink:#04170E; --warn:#F0A25B; --bld:#323A46; --bld-line:#4A5564;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1A1F26; --surface2:#242B34; --fg:#EEF1F5; --muted:#9AA5B3; --line:#2E3742;
  --a:#F3B61F; --a-ink:#1B1500; --b:#5C8CFF; --b-ink:#0A1228; --go:#3DBB7E; --go-ink:#04170E; --warn:#F0A25B; --bld:#323A46; --bld-line:#4A5564;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.35;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:30px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:0;border-radius:10px;min-height:52px;padding:0 18px;font-weight:600;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

/* Start */
.choice{display:flex;flex-direction:column;gap:10px}
.choice button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;min-height:76px}
.choice .tag{font-family:var(--f-display);font-weight:700;font-size:40px;width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.tag.A{background:var(--a);color:var(--a-ink)} .tag.B{background:var(--b);color:var(--b-ink)} .tag.M{background:var(--surface2);color:var(--fg);font-size:26px}
.choice strong{display:block;font-size:19px}
.choice .hint{font-size:14px;color:var(--muted)}
.choice button[aria-pressed="true"]{border:2px solid var(--fg)}
.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}

/* Auswahl */
.tabs{display:flex;gap:8px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-weight:600}
.tabs button[aria-selected="true"].A{background:var(--a);color:var(--a-ink);border-color:var(--a)}
.tabs button[aria-selected="true"].B{background:var(--b);color:var(--b-ink);border-color:var(--b)}
.search{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.block{border-top:1px solid var(--line);padding-top:10px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.block-head h3{font-size:22px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.chip.on.A{background:var(--a);color:var(--a-ink);border-color:var(--a)}
.chip.on.B{background:var(--b);color:var(--b-ink);border-color:var(--b)}
.chip .q{position:absolute;top:-6px;right:-4px;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;width:16px;height:16px;line-height:16px;text-align:center}
.chip .nt{display:block;font-size:11px;font-weight:500;opacity:.75;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.bar .btn{flex:1}

/* Tour */
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--go);width:0}
.now{border:2px solid var(--fg);border-radius:16px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.now .part{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block}
.dot.A{background:var(--a)} .dot.B{background:var(--b)}
.now h2{font-size:32px;font-weight:700;line-height:1.02}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.num{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1;padding:5px 10px;border-radius:10px;background:var(--surface2);font-variant-numeric:tabular-nums}
.nums.big .num{font-size:34px}
.note{font-size:14px;color:var(--muted)}
.mapwrap{display:flex;flex-direction:column;gap:6px}
#mapslot{touch-action:none}
svg.map{touch-action:none;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.m-ctx{fill:var(--muted);opacity:.55}
.m-cnum{font:600 9.5px var(--f-body);fill:#000;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.m-nx{stroke-width:3.2}
.m-nxt{font-weight:700;font-size:12px}
.m-dn{opacity:.55}
.m-walk.L{stroke:var(--go);stroke-width:2.5} .m-walk.R{stroke:var(--warn);stroke-width:2.5}
.m-cur.L{stroke:var(--go);stroke-width:4} .m-cur.R{stroke:var(--warn);stroke-width:4}
.m-p2{fill:var(--surface);stroke:var(--fg);stroke-width:2.5} .m-pt2{font:700 13px var(--f-display);fill:var(--fg)}
.m-me{fill:#2F6BFF;stroke:#fff;stroke-width:3} .m-acc{fill:#2F6BFF;opacity:.18}
.m-edge polygon{fill:var(--fg)} .m-edge text{font:700 12px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--surface2);stroke-width:3px;text-anchor:middle}
.m-edgeme polygon{fill:#2F6BFF} .m-edgeme text{fill:#2F6BFF}
.m-gps{font:600 12px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.m-rcase{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.m-rline{fill:none;stroke:#2F6BFF;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.m-tgt{fill:none;stroke:#2F6BFF;stroke-width:3.5}
.navbig{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1}
.m-b{fill:var(--bld);stroke:var(--bld-line);stroke-width:1;stroke-linejoin:round}
.m-b-done{opacity:.55}
.m-b-up{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}
.m-b-nx{fill:var(--surface);stroke:var(--fg);stroke-width:2.6}
.m-b-cur{stroke-width:3.4}
.m-b-cur.A{fill:var(--a)} .m-b-cur.B{fill:var(--b)} .m-b-cur.L{stroke:var(--go)} .m-b-cur.R{stroke:var(--warn)}
.m-bt{font:700 10px var(--f-body);fill:#000;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.m-bt.nx{font-weight:700} .m-bt.dn{opacity:.6}
.m-bt.cur{font:700 18px var(--f-display);fill:#F2B600;stroke:#1a1300;stroke-width:4px}
.m-bdg{fill:var(--fg)} .m-bdgt{font:700 10px var(--f-body);fill:var(--bg);text-anchor:middle;pointer-events:none}
.m-hit{fill:transparent;cursor:pointer}
.m-meA{fill:#2F6BFF;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}
.m-toline{stroke:#2F6BFF;stroke-width:2;stroke-dasharray:6 5;opacity:.7}
.m-edgenx polygon{fill:var(--muted)} .m-edgenx text{fill:var(--muted)}
.m-off2{opacity:.6;font-weight:500}
.num.L{border-left:6px solid var(--go)} .num.R{border-left:6px solid var(--warn)}
.sidehint{font-size:13px;color:var(--muted)}
.m-bg{fill:var(--surface2)}
.m-road{fill:none;stroke:var(--surface);stroke-linecap:round;stroke-linejoin:round}
.m-case{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.m-foot{fill:none;stroke:var(--line);stroke-width:1.2px;stroke-dasharray:2 3}
.m-road{fill:none;stroke:var(--surface);stroke-linecap:round;stroke-linejoin:round}
.m-casing{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.m-road2{fill:none;stroke:var(--surface);stroke-linecap:round;opacity:.6}
.m-foot{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:2 3}
.m-street{font:600 11px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.m-route{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none}
.m-route2{stroke:var(--fg);stroke-width:2;stroke-dasharray:2 5;fill:none;opacity:.5}
.m-h{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.m-up{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.m-done{fill:var(--go);stroke:none;opacity:.6}
.m-off{fill:var(--line);stroke:none}
.m-num{font:700 11px var(--f-body);fill:#000;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.m-walk{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:3 3}
.m-cur{stroke:var(--fg);stroke-width:2}
.m-cur.A{fill:var(--a)} .m-cur.B{fill:var(--b)}
.m-curnum{font:700 20px var(--f-display);fill:#F2B600;paint-order:stroke;stroke:#1a1300;stroke-width:4px;stroke-linejoin:round}
.m-p{fill:var(--fg)} .m-pt{font:700 14px var(--f-display);fill:var(--bg)}
.m-head{stroke:var(--go);stroke-width:3} .m-headfill{fill:var(--go)}
.m-n{font:700 11px var(--f-body);fill:var(--muted)} .m-scale{stroke:var(--fg);stroke-width:3}
.num small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);line-height:1.1;margin-top:2px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnote{width:100%;min-height:44px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--fg);padding:0 12px;font:inherit;font-size:15px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.item .t{flex:1;min-width:0}
.item .s{font-family:var(--f-display);font-weight:600;font-size:21px}
.item .n{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.item .idx{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);width:30px;text-align:right;flex:none}
.divider{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:600;margin-top:6px}
.divider::after{content:"";height:1px;background:var(--line);flex:1}
.done .s,.done .n{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;padding:28px 12px}
.empty h2{font-size:34px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .25s}}
</style>

  try{gpsWatch=navigator.geolocation.watchPosition(function(p){var nlat=p.coords.latitude,nlon=p.coords.longitude,hd=(gps?gps.hd:null), sp=p.coords.speed, h=p.coords.heading;
      if(h!=null&&!isNaN(h)&&(sp==null||sp>1.0)) hd=h;
      else if(lastPos&&meters(lastPos,{lat:nlat,lon:nlon})>6){hd=bearing(lastPos,{lat:nlat,lon:nlon});}
      if(!lastPos||meters(lastPos,{lat:nlat,lon:nlon})>6) lastPos={lat:nlat,lon:nlon};
      gps={lat:nlat,lon:nlon,acc:p.coords.accuracy||30,hd:hd}; gpsErr=null; refreshNav(); var sp=document.getElementById('savePark'); if(sp) sp.disabled=false;},function(e){gpsErr=e.code||-1; refreshMap();},{enableHighAccuracy:true,maximumAge:2000,timeout:30000});}catch(e){gpsErr=-1;}
}
function keepAwake(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&gpsOn) keepAwake();});
function stopGps(){try{if(gpsWatch!==null) navigator.geolocation.clearWatch(gpsWatch);}catch(e){} gpsWatch=null; gpsOn=false; gps=null; refreshMap();}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function go(phase){st.phase=phase;save();render();window.scrollTo(0,0);}
function setMode(m){st.mode=m;st.tab=pickParts(m)[0];save();render();}

/* ---------- Ansichten ---------- */
function viewStart(){
  var sg=suggest(), names={A:['A','A-Teil hat Werbung','Mittwoch und Freitag. Im B-Teil nur Priority und Päckchen.'],
    B:['B','B-Teil hat Werbung','Dienstag und Donnerstag. Im A-Teil nur Priority und Päckchen.'],
    M:['Mo','Montag, keine Werbung','Im A- und B-Teil nur Priority und Päckchen.']};
  var h='<div class="top"><h1>Tour Wolfurt</h1><span class="muted small">'+new Date().toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long'})+'</span></div>';
  h+='<div class="card"><h2 style="font-size:26px">Welcher Teil hat heute Werbung?</h2><p class="muted" style="margin:6px 0 0">Im anderen Teil wählst du gleich die Adressen mit Priority oder Päckchen.</p></div>';
  h+='<div class="choice">';
  ['A','B','M'].forEach(function(k){
    h+='<button data-mode="'+k+'" aria-pressed="'+(st.mode===k)+'"><span class="tag '+k+'">'+names[k][0]+'</span><span><strong>'+names[k][1]+(k===sg?'<span class="badge">laut Plan heute</span>':'')+'</strong><span class="hint">'+names[k][2]+'</span></span></button>';
  });
  h+='</div>';
  h+='<div class="bar"><button class="btn primary" id="next" '+(st.mode?'':'disabled')+'>Weiter zur Auswahl</button></div>';
  return h;
}

function viewPick(){
  var parts=pickParts(st.mode); if(parts.indexOf(st.tab)<0) st.tab=parts[0];
  var label=st.mode==='M'?'Montag':(st.mode+'-Teil hat Werbung');
  var h='<div class="top"><div><h1>Priority und Päckchen</h1><div class="muted small">'+label+'. Tippe die Adressen in der Reihenfolge des Tisches an.</div></div></div>';
  if(parts.length>1){
    h+='<div class="tabs" role="tablist">'+parts.map(function(p){
      var c=ITEMS.filter(function(i){return i.part===p&&st.sel[i.f];}).length;
      return '<button role="tab" class="'+p+'" data-tab="'+p+'" aria-selected="'+(st.tab===p)+'">'+p+'-Teil · '+c+'</button>';}).join('')+'</div>';
  } else {
    var c1=ITEMS.filter(function(i){return i.part===parts[0]&&st.sel[i.f];}).length;
    h+='<div class="row" style="align-items:center"><span class="dot '+parts[0]+'"></span><strong>'+parts[0]+'-Teil · '+c1+' gewählt</strong></div>';
  }
  h+='<div class="row"><button class="btn sm" id="loadVor">Liste vom Vorarbeiter übernehmen</button><button class="btn sm ghost" id="clearSel">Auswahl leeren</button></div><div class="note">Wählt die Adressen, die der Vorarbeiter aus dem Auto mitnimmt, und nutzt seine Stopps.</div>';
  h+='<input class="search" id="q" type="search" inputmode="search" placeholder="Suchen, zum Beispiel Zieg 12" value="'+esc(st.q)+'" autocomplete="off">';
  h+='<div id="blocks">'+blocksHtml()+'</div>';
  var total=activeStops().length;
  h+='<div class="bar"><button class="btn ghost" id="back" style="flex:0 0 auto">Zurück</button><button class="btn primary" id="startTour" '+(total?'':'disabled')+'>Tour starten · '+total+' Adressen</button></div>';
  return h;
}
function blocksHtml(){
  var q=(st.q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  var list=ITEMS.filter(function(i){return i.part===st.tab;});
  var blocks=[],b=null;
  list.forEach(function(it){
    var hay=(it.s+' '+it.n+' '+it.note).toLowerCase();
    if(q.length&&!q.every(function(t){return hay.indexOf(t)>=0;})){b=null;return;}
    if(!b||b.street!==it.s){b={street:it.s,items:[]};blocks.push(b);}
    b.items.push(it);
  });
  if(!blocks.length) return '<div class="muted empty">Keine Adresse gefunden.</div>';
  return blocks.map(function(bl,bi){
    var all=bl.items.every(function(i){return st.sel[i.f];});
    return '<section class="block"><div class="block-head"><h3>'+esc(bl.street)+'</h3><button class="btn sm ghost" data-all="'+bi+'">'+(all?'Alle ab':'Alle')+'</button></div><div class="chips">'+
      bl.items.map(function(i){
        return '<button class="chip '+i.part+(st.sel[i.f]?' on':'')+'" data-f="'+i.f+'" aria-pressed="'+(!!st.sel[i.f])+'">'+esc(i.n)+(i.u?'<span class="q" title="unsicher gelesen">?</span>':'')+(i.note?'<span class="nt">'+esc(i.note)+'</span>':'')+'</button>';}).join('')+
      '</div></section>';
  }).join('');
}
var lastBlocks=[];

function viewTour(){
  var groups=groupStops(activeStops(),SPANS[st.span]);
  var doneN=groups.filter(groupDone).length, total=groups.length;
  var nextIdx=groups.findIndex(function(g){return !groupDone(g);});
  var h='<div class="top"><button class="btn sm ghost" id="toPick">Auswahl</button><span class="small muted" style="font-variant-numeric:tabular-nums">'+doneN+' von '+total+' Halten</span><button class="btn sm ghost" id="reset">Neuer Tag</button></div>';
  h+='<div class="progress" aria-hidden="true"><i style="width:'+(total?Math.round(doneN/total*100):0)+'%"></i></div>';
  var spanHtml=''; spanHtml='<div><div class="small muted" style="margin-bottom:6px">Größter Fußweg zu einem Haus</div><div class="seg">'+[['eng','20 m'],['normal','30 m'],['weit','45 m']].map(function(a){return '<button data-span="'+a[0]+'" aria-pressed="'+(st.span===a[0])+'">'+a[1]+'</button>';}).join('')+'</div></div>';
  if(!total){ return h+'<div class="card empty"><h2>Nichts ausgewählt</h2><p class="muted">Wähle zuerst die Adressen mit Priority oder Päckchen.</p><button class="btn primary" id="toPick2">Zur Auswahl</button></div>'; }
  if(nextIdx<0){
    return h+'<div class="card empty"><h2>Tour fertig</h2><p class="muted">'+total+' Halte, '+activeStops().length+' Adressen erledigt.</p></div>'+
      (st.log.length?'<button class="btn ghost" id="undo">Letzten Halt zurücknehmen</button>':'');
  }
  if(peek!==null&&(peek<=nextIdx||peek>=total)) peek=null;
  var vi=peek!==null?peek:nextIdx, pv=peek!==null;
  var g=groups[vi], hd=heading(groups,vi); if(CUR&&CUR.vi!==vi) panC=null; CUR={groups:groups,vi:vi};
  var nt=''; g.items.forEach(function(i){if(!nt&&notes[i.f])nt=notes[i.f];});
  var ahead=groups.slice(vi,vi+6);
  var routeHtml=(ahead.length>1&&!pv)?'<div class="row"><button class="btn ghost sm" id="doneMulti" data-n="'+ahead.length+'">Diese '+ahead.length+' Halte erledigt</button></div>':'';
  var itemNotes=g.items.filter(function(i){return i.note;}).map(function(i){return i.n+': '+i.note;}).join(' · ');
  var nx=groups[vi+1], nxTxt=nx?('Danach: '+esc(nx.street)+' '+esc(numsText(nx))+' · '+Math.round(meters(g,nx))+' m'):'';
  var nL=0,nR=0; if(hd) g.items.forEach(function(i){var r=sideOf(g,i,hd); if(r&&r.d>=4){if(r.left)nL++; else nR++;}});
  h+='<div class="now"><div class="part"><span class="dot '+g.part+'"></span>'+g.part+'-Teil · '+(pv?'Vorschau · ':'')+'Halt '+(vi+1)+' von '+total+' · Fach '+fachRange(g)+'</div>'+
    '<h2>'+esc(g.street)+'</h2><div class="nums'+(g.items.length<=2?' big':'')+'">'+g.items.map(function(i){var r=hd?sideOf(g,i,hd):null; return '<span class="num'+(r&&r.d>=4?(r.left?' L':' R'):'')+'">'+esc(lbl(g,i))+relHtml(g,i,hd)+'</span>';}).join('')+'</div>'+
    (hd&&nR?'<div class="sidehint">Grün = Fahrerseite (links). Orange = rechts, Beifahrerseite.</div>':'')+
    '</div>'+
    mapBlock(groups,vi)+
    (nxTxt?'<div class="note">'+nxTxt+'</div>':'')+
    '<div class="card list" style="gap:10px">'+
    (itemNotes?'<div class="note">'+esc(itemNotes)+'</div>':'')+(g.items.length>1?'<div class="note">Zu Fuß bis ca. '+parkOf(g).maxd+' m vom Halt'+(g.custom?' · eigener Halteplatz':'')+'</div>':'')+(g.items.some(function(i){return i.est;})?'<div class="note">Lage einzelner Häuser geschätzt</div>':'')+
    ''+routeHtml+
    '<input class="pnote" id="pnote" placeholder="Wo halten? Notiz für nächstes Mal" value="'+esc(nt)+'" data-key="'+g.items[0].f+'">'+
    '<div class="row"><button class="btn ghost sm" id="flagBtn">Adresse prüfen</button></div></div>';
  h+='<div class="divider">Danach</div><div class="list">';
  var shown=0,lastPart=g.part;
  for(var i=vi+1;i<groups.length&&shown<8;i++){
    var x=groups[i];
    if(x.part!==lastPart){h+='<div class="divider">'+x.part+'-Teil</div>';lastPart=x.part;}
    h+='<button class="item" data-peek="'+i+'" style="width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer"><span class="idx">'+(i+1)+'</span><div class="t"><div class="s">'+esc(x.street)+'</div><div class="n">'+esc(numsText(x))+'</div></div></button>';
    shown++;
  }
  if(vi+1+shown<groups.length) h+='<div class="muted small" style="text-align:center">und '+(groups.length-vi-1-shown)+' weitere</div>';
  h+='</div>';
  h+='<div><div class="small muted" style="margin-bottom:6px">Halte bilden nach</div><div class="seg"><button data-gmode="komplex" aria-pressed="'+(st.gmode==='komplex')+'">Komplexe</button><button data-gmode="auto" aria-pressed="'+(st.gmode==='auto')+'">Radius</button><button data-gmode="vor" aria-pressed="'+(st.gmode==='vor')+'">Vorarbeiter</button></div></div>';
  h+=spanHtml;
  h+='<div class="bar">'+(pv?'<button class="btn" id="peekBack">Zurück zum aktuellen Halt</button>':
    '<button class="btn ghost" style="flex:0 0 56px;padding:0" aria-label="Halt zurücknehmen" id="undo"'+(st.log.length?'':' disabled')+'>↶</button><button class="btn primary" id="doneBtn" style="flex:3">Erledigt, weiter</button>')+
    '<button class="btn ghost" style="flex:0 0 56px;padding:0" aria-label="Vorheriger Halt" '+(vi>nextIdx?'data-peek="'+(vi-1)+'"':'disabled')+'>‹</button><button class="btn ghost" style="flex:0 0 56px;padding:0" aria-label="Nächster Halt" '+(vi+1<total?'data-peek="'+(vi+1)+'"':'disabled')+'>›</button></div>';
  return h;
}

/* ---------- Rendern und Ereignisse ---------- */
function render(){
  var app=document.getElementById('app');
  var q=document.activeElement&&document.activeElement.id==='q';
  app.innerHTML = (st.phase==='start'?viewStart():st.phase==='pick'?viewPick():viewTour()) + (st.phase==='pick'?'':exportHtml());
  if(st.phase==='tour'&&!gpsOn&&!gpsTried){gpsTried=true;startGps();}
  if(q){var el=document.getElementById('q');if(el){el.focus();var l=el.value.length;try{el.setSelectionRange(l,l);}catch(e){}}}
}
document.getElementById('app').addEventListener('click',function(e){
  if(Date.now()<noClickUntil) return;
  var hit=e.target.closest('[data-hit]'); if(hit){var it=ITEMS[+hit.getAttribute('data-hit')-1]; if(it) target(it.lat,it.lon,it.s+' '+it.n,normName(it.s)); return;}
  var hn=e.target.closest('[data-nav]'); if(hn){var q=hn.getAttribute('data-nav').split(','); target(+q[0],+q[1],hn.getAttribute('data-lbl')||'Ziel',hn.getAttribute('data-pref')); return;}
  var t=e.target.closest('button,a'); if(!t) return;
  if(t.id==='navEnd'){navTarget=null; ROUTE=null; refreshNav(true); return;}
  if(t.id==='navStop'){var gg=CUR&&CUR.groups[CUR.vi]; if(gg) target(gg.lat,gg.lon,'Halt '+(CUR.vi+1)+' · '+gg.street+' '+numsText(gg),normName(gg.s0)); return;}
  if(t.id==='followBtn'){var nf=(st.follow===false); if(!nf&&lastC&&!panC) panC={lat:lastC.lat,lon:lastC.lon}; if(nf) panC=null; st.follow=nf; save(); t.setAttribute('aria-pressed',nf); t.textContent=nf?'Karte fixiert (folgt mir)':'Karte frei · verschieben'; refreshMap(); return;}
  if(t.id==='upBtn'){st.up=(st.up==='head'?'north':'head'); save(); t.setAttribute('aria-pressed',st.up==='head'); refreshMap(); return;}
  if(t.dataset.peek!==undefined){navTarget=null;ROUTE=null;peek=+t.dataset.peek;render();window.scrollTo(0,0);return;}
  if(t.id==='peekBack'){navTarget=null;ROUTE=null;peek=null;render();window.scrollTo(0,0);return;}
  if(t.id==='doneBtn'||t.id==='doneMulti'||t.id==='undo'||t.dataset.span||t.id==='toPick'||t.id==='toPick2') {peek=null; navTarget=null;ROUTE=null;}
  if(t.dataset.mode){setMode(t.dataset.mode);return;}
  if(t.id==='next'){go('pick');return;}
  if(t.id==='back'){go('start');return;}
  if(t.dataset.tab){st.tab=t.dataset.tab;save();render();return;}
  if(t.dataset.f){var f=t.dataset.f; if(st.sel[f]) delete st.sel[f]; else st.sel[f]=true; save(); refreshPick(); return;}
  if(t.dataset.all!==undefined){
    var items=blockItems()[+t.dataset.all]||[]; var all=items.every(function(i){return st.sel[i.f];});
    items.forEach(function(i){ if(all) delete st.sel[i.f]; else st.sel[i.f]=true; }); save(); refreshPick(); return;}
  if(t.id==='loadVor'){pickParts(st.mode).forEach(function(p){});var pp=pickParts(st.mode); VOR.forEach(function(gr){gr.forEach(function(f){var it=ITEMS[f-1]; if(it&&pp.indexOf(it.part)>=0) st.sel[f]=true;});}); st.gmode='vor'; save(); render(); return;}
  if(t.id==='clearSel'){pickParts(st.mode).forEach(function(p){ITEMS.forEach(function(it){if(it.part===p) delete st.sel[it.f];});}); save(); render(); return;}
  if(t.dataset.gmode){st.gmode=t.dataset.gmode; peek=null; save(); render(); return;}
  if(t.id==='startTour'){go('tour');startGps();return;}
  if(t.id==='toPick'||t.id==='toPick2'){go('pick');return;}
  if(t.dataset.zoom){st.R=({near:42,mid:85,far:170})[t.dataset.zoom]; save(); refreshMap(); setZoomBtns(); return;}
  if((t.id==='zoomIn'||t.id==='zoomOut')&&st.follow!==false&&gps){return;}
  if(t.id==='zoomIn'){st.R=Math.max(15,curR()/1.4); save(); refreshMap(); setZoomBtns(); return;}
  if(t.id==='zoomOut'){st.R=Math.min(500,curR()*1.4); save(); refreshMap(); setZoomBtns(); return;}
  if(t.id==='centerBtn'){panC=null; refreshMap(); return;}
  if(t.id==='gpsBtn'){if(gpsOn){stopGps();t.setAttribute('aria-pressed','false');}else{startGps();t.setAttribute('aria-pressed','true');refreshMap();var sp=document.getElementById('savePark');if(sp)sp.disabled=!gps;} return;}
  if(t.id==='savePark'){if(gps&&t.dataset.key){custom[t.dataset.key]=[+gps.lat.toFixed(6),+gps.lon.toFixed(6)];saveCustom();render();} return;}
  if(t.id==='clearPark'){delete custom[t.dataset.key];saveCustom();render();return;}
  if(t.id==='flagBtn'){var gg=groupStops(activeStops(),SPANS[st.span]).find(function(x){return !groupDone(x);}); if(gg){var f0=gg.items[0].f, cur=notes[f0]||''; if(cur.indexOf('[Prüfen]')<0){notes[f0]='[Prüfen] '+cur; saveNotes(); render();}} return;}
  if(t.dataset.span){st.span=t.dataset.span;save();render();return;}
  if(t.id==='doneBtn'){
    var groups=groupStops(activeStops(),SPANS[st.span]), g=groups.find(function(x){return !groupDone(x);});
    if(g){var fs=g.items.map(function(i){return i.f;}); fs.forEach(function(f){st.done[f]=true;}); st.log.push(fs); save(); render(); window.scrollTo(0,0);}
    return;}
  if(t.id==='doneMulti'){var gs2=groupStops(activeStops(),SPANS[st.span]).filter(function(x){return !groupDone(x);}).slice(0,+t.dataset.n); gs2.forEach(function(x){var fs=x.items.map(function(i){return i.f;}); fs.forEach(function(f){st.done[f]=true;}); st.log.push(fs);}); save(); render(); window.scrollTo(0,0); return;}
  if(t.id==='copyNotes'){notesOut=notesText(); try{navigator.clipboard.writeText(notesOut).catch(function(){});}catch(e){} render(); var ta=document.getElementById('nout'); if(ta){ta.focus();ta.select();} return;}
  if(t.id==='undo'){var last=st.log.pop(); if(last) last.forEach(function(f){delete st.done[f];}); save(); render(); return;}
  if(t.id==='reset'){
    if(t.dataset.arm){st=fresh();save();render();return;}
    t.dataset.arm='1'; t.textContent='Wirklich löschen?'; setTimeout(function(){if(t&&t.isConnected){delete t.dataset.arm;t.textContent='Neuer Tag';}},3500); return;}
});
document.getElementById('app').addEventListener('input',function(e){
  if(e.target.id==='q'){st.q=e.target.value;save();document.getElementById('blocks').innerHTML=blocksHtml();return;}
  if(e.target.id==='pnote'){notes[e.target.dataset.key]=e.target.value;saveNotes();}
});
function blockItems(){
  var q=(st.q||'').toLowerCase().trim().split(/\s+/).filter(Boolean), blocks=[], b=null;
  ITEMS.filter(function(i){return i.part===st.tab;}).forEach(function(it){
    var hay=(it.s+' '+it.n+' '+it.note).toLowerCase();
    if(q.length&&!q.every(function(t){return hay.indexOf(t)>=0;})){b=null;return;}
    if(!b||b.street!==it.s){b={street:it.s,items:[]};blocks.push(b);}
    b.items.push(it);
  });
  return blocks.map(function(x){return x.items;});
}
function refreshPick(){
  var y=window.scrollY; render(); window.scrollTo(0,y);
}
render();
</script>
